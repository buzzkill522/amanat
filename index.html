<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Amanat teaches money skills to Deaf and Hard-of-Hearing children, using video, Indian Sign Language and pictures. Sorted by difficulty, not by age."
    />
    <!-- `surface`, the header colour. This tints the browser's own chrome, so
         it has to match the top of the page rather than any nominal "brand"
         value - the header is a light surface with a hairline, not a filled
         bar. The value here is the light theme's; ThemeProvider rewrites it
         from the live stylesheet when the theme changes, so the two cannot
         drift apart. -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Amanat - Money, in your hands</title>

    <!--
      Set the theme before the first paint.

      Without this the page paints light, React mounts, and only then does the
      attribute land - a white flash on the way into a dark page. It is brief,
      but a bright flash is exactly what someone who chose the dark theme was
      trying to avoid, and for a light-sensitive reader it is the whole problem
      rather than a cosmetic one.

      Inline and synchronous on purpose: an external file could be fetched
      after the first paint, which would defeat it. It reads the same key
      ThemeProvider writes, and falls back to light appearance.
    -->
    <script>
      (function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('amanat.theme.v1')
          theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : 'light'
        } catch (e) {
          // Storage blocked: retain the light default.
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
