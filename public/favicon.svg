<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- The header mark, simplified for tab and home-screen sizes: a thicker
       outline, and a solid pupil instead of the rupee glyph, which disappears
       below about 24px anyway.

       Colours are literals because a favicon renders in the browser's own
       chrome, outside the page's light/dark toggle, and nothing in this file
       can read a custom property. They are the palette's values: ink #161616
       and gold-500 #ffd23f. If either changes in palette.js, change it here by
       hand - this is the one copy of palette values the project keeps.

       The white of the eye is filled on purpose. A tab bar can be light or
       dark; a black outline alone vanishes on a dark one, but a white eye with
       a black edge and a gold iris reads on both.

       It was violet (#4f46e5) until this redraw - left over from a scheme two
       palettes ago, so the tab showed a colour the site no longer used. -->
  <path d="M3,24 Q24,6 45,24 Q24,42 3,24 Z" fill="#ffffff" stroke="#161616" stroke-width="4" stroke-linejoin="round" />
  <circle cx="24" cy="24" r="10" fill="#ffd23f" stroke="#161616" stroke-width="3" />
  <circle cx="24" cy="24" r="3.6" fill="#161616" />
</svg>
