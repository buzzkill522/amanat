<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified for tab/home-screen sizes: thicker stroke, solid pupil,
       no rupee glyph - it disappears below about 24px anyway. Colour is
       fixed rather than theme-aware; a favicon renders in the browser's own
       chrome, outside the page's light/dark toggle.

       The fixed colour is clay-500 from the LIGHT theme in palette.js. It is
       written out as a literal here because nothing in this file can read a
       custom property, so if the accent changes this hex has to be changed by
       hand - it is the one copy of a palette value the project keeps.
       It was #a8451c for a while, left over from the retired terracotta
       scheme, which put a rust eye in the tab beside a violet site. -->
  <path d="M4,24 Q24,6 44,24 Q24,42 4,24 Z" fill="none" stroke="#4f46e5" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
  <circle cx="24" cy="24" r="10" fill="#4f46e5" />
</svg>
